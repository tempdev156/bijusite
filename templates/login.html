<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PrivateChat - Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            PrivateChat
        </div>

        <p class="subtitle">
            Private conversations. Simple.
        </p>

        <h2>Welcome back</h2>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="your_username"
                autocomplete="username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p class="switch">
            Don't have an account?
            <a href="{{ url_for('register') }}">
                Create one
            </a>
        </p>

    </div>

</div>

</body>
</html>
