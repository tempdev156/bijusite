<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PrivateChat - Register</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            PrivateChat
        </div>

        <p class="subtitle">
            Create your private account
        </p>

        <h2>Get started</h2>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <label>Full name</label>

            <input
                type="text"
                name="full_name"
                placeholder="Your full name"
                autocomplete="name"
                required
            >

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="username_123"
                autocomplete="username"
                pattern="[A-Za-z0-9_]+"
                required
            >

            <small>
                Letters, numbers and underscore only.
            </small>

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Minimum 8 characters"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <label>Confirm password</label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Repeat password"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <button type="submit">
                Create account
            </button>

        </form>

        <p class="switch">
            Already have an account?
            <a href="{{ url_for('login') }}">
                Login
            </a>
        </p>

    </div>

</div>

</body>
</html>
